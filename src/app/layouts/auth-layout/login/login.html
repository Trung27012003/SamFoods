<section class="auth-page">
	<div class="auth-grid">
		<app-auth-hero
			title="Chào mừng đến với SamFoods"
			subtitle="Hệ thống quản lý bán hàng thông minh, hiện đại và dễ sử dụng."
			[bullets]="[
				'Theo dõi đơn hàng theo thời gian thực',
				'Quản lý sản phẩm & danh mục tập trung',
				'Khuyến mãi và voucher hấp dẫn'
			]">
		</app-auth-hero>

		<div class="auth-card">
			<div class="auth-card__header">
				<img [src]="logoURL()" alt="logo" />
				<h2>Đăng nhập</h2>
				<p>Chào mừng bạn quay lại</p>
			</div>

			<form [formGroup]="validateForm" (ngSubmit)="handleOk()" class="auth-form">
				<nz-spin [nzSpinning]="isLoading">
					<label class="auth-field" [class.is-error]="isFieldInvalid('userName')">
						<i class="fa-solid fa-user auth-field__icon"></i>
						<input nz-input formControlName="userName" placeholder="Tên đăng nhập" autocomplete="username" />
					</label>
					@if (isFieldInvalid('userName')) {
					<div class="auth-field-error">Vui lòng nhập tên đăng nhập (ít nhất 3 ký tự)!</div>
					}

					<label class="auth-field" [class.is-error]="isFieldInvalid('password')">
						<i class="fa-solid fa-lock auth-field__icon"></i>
						<input [type]="showPassword ? 'text' : 'password'" nz-input formControlName="password"
							placeholder="Mật khẩu" autocomplete="current-password" />
						<i class="fa-solid auth-field__suffix"
							[class.fa-eye]="!showPassword"
							[class.fa-eye-slash]="showPassword"
							(click)="togglePassword()"></i>
					</label>
					@if (isFieldInvalid('password')) {
					<div class="auth-field-error">Vui lòng nhập mật khẩu (ít nhất 6 ký tự)!</div>
					}

					<div class="auth-row">
						<label class="auth-check">
							<input type="checkbox" />
							<span>Ghi nhớ đăng nhập</span>
						</label>
						<a routerLink="/change-password">Quên mật khẩu?</a>
					</div>

					<button nz-button nzType="primary" nzBlock class="auth-submit" [disabled]="isLoading">
						Đăng nhập
					</button>

					<div class="auth-switch">
						Chưa có tài khoản?
						<a (click)="goToRegister()">Đăng ký ngay</a>
					</div>
				</nz-spin>
			</form>
		</div>
	</div>
</section>
