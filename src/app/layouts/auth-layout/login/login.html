<section class="gradient-form">
    <div class="container py-5 h-100">
        <div class="row d-flex justify-content-center align-items-center h-100">
            <div class="col-xl-10">
                <div class="card rounded-3 text-black">
                    <div class="row g-0">
                        <div class="col-lg-6 d-flex align-items-center gradient-custom-2">
                            <div class="text-white px-3 py-4 p-md-5 mx-md-4">
                                <a routerLink="/home" class="back-home-link">
                                    <i class="fa-solid fa-arrow-left me-2"></i>Quay lại trang chủ
                                </a>
                                <h4 class="mb-4 mt-3">Chào mừng đến với SamFoods</h4>
                                <p class="small mb-0">Hệ thống quản lý bán hàng thông minh, hiện đại và dễ sử dụng.</p>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="card-body p-md-5 mx-md-4">
                                <div class="text-center">
                                    <img [src]="logoURL()" style="width: 100px;" alt="logo">
                                    <h4 class="mt-3 mb-4 pb-1">Đăng nhập</h4>
                                </div>

                                <form [formGroup]="validateForm" (ngSubmit)="handleOk()">
                                    <nz-spin [nzSpinning]="isLoading">
                                        <div class="form-row">
                                            <div class="form-label">
                                                <nz-form-label nzRequired>Tên đăng nhập</nz-form-label>
                                            </div>
                                            <nz-form-control nzErrorTip="Vui lòng nhập tên đăng nhập (ít nhất 3 ký tự)!">
                                                <input nz-input formControlName="userName" placeholder="Nhập tên đăng nhập" autocomplete="username" />
                                            </nz-form-control>
                                        </div>

                                        <div class="form-row">
                                            <div class="form-label">
                                                <nz-form-label nzRequired>Mật khẩu</nz-form-label>
                                            </div>
                                            <nz-form-control nzErrorTip="Vui lòng nhập mật khẩu (ít nhất 6 ký tự)!">
                                                <nz-input-group [nzSuffix]="suffixTemplate">
                                                    <input [type]="showPassword ? 'text' : 'password'" nz-input formControlName="password" placeholder="Nhập mật khẩu" autocomplete="current-password" />
                                                </nz-input-group>
                                                <ng-template #suffixTemplate>
                                                    <nz-icon nzType="eye" nzTheme="outline" style="cursor: pointer;" (click)="togglePassword()"></nz-icon>
                                                </ng-template>
                                            </nz-form-control>
                                        </div>

                                        <div class="text-center pt-1 mb-5 pb-1">
                                            <button nz-button nzType="primary" nzBlock class="login-btn">
                                                Đăng nhập
                                            </button>
                                        </div>

                                        <div class="d-flex align-items-center justify-content-center pb-4">
                                            <p class="mb-0 me-2">Bạn chưa có tài khoản?</p>
                                            <button nz-button nzType="link" (click)="goToRegister()">Đăng ký ngay</button>
                                        </div>
                                    </nz-spin>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
