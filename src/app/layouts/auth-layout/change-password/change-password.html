<section class="change-password-page">
	<div class="container py-5">
		<div class="row justify-content-center">
			<div class="col-md-6 col-lg-5">
				<div class="card shadow">
					<div class="card-body p-4">
						<h3 class="text-center mb-4">Đổi mật khẩu</h3>

						<form [formGroup]="validateForm" (ngSubmit)="handleOk()">
							<nz-spin [nzSpinning]="isLoading">
								<nz-form-item>
									<nz-form-label nzRequired>Mật khẩu cũ</nz-form-label>
									<nz-form-control nzErrorTip="Vui lòng nhập mật khẩu cũ (ít nhất 6 ký tự)!">
										<nz-input-group [nzSuffix]="oldPasswordSuffixTemplate">
											<input [type]="showOldPassword ? 'text' : 'password'" nz-input
												formControlName="OldPassword" placeholder="Nhập mật khẩu cũ"
												autocomplete="current-password" />
										</nz-input-group>
										<ng-template #oldPasswordSuffixTemplate>
											<nz-icon nzType="eye" nzTheme="outline" style="cursor: pointer;"
												(click)="toggleOldPassword()"></nz-icon>
										</ng-template>
									</nz-form-control>
								</nz-form-item>

								<nz-form-item class="mt-3">
									<nz-form-label nzRequired>Mật khẩu mới</nz-form-label>
									<nz-form-control nzErrorTip="Vui lòng nhập mật khẩu mới (ít nhất 6 ký tự)!">
										<nz-input-group [nzSuffix]="newPasswordSuffixTemplate">
											<input [type]="showNewPassword ? 'text' : 'password'" nz-input
												formControlName="NewPassword" placeholder="Nhập mật khẩu mới"
												autocomplete="new-password" />
										</nz-input-group>
										<ng-template #newPasswordSuffixTemplate>
											<nz-icon nzType="eye" nzTheme="outline" style="cursor: pointer;"
												(click)="toggleNewPassword()"></nz-icon>
										</ng-template>
									</nz-form-control>
								</nz-form-item>

								<nz-form-item class="mt-3">
									<nz-form-label nzRequired>Xác nhận mật khẩu mới</nz-form-label>
									<nz-form-control nzErrorTip="Mật khẩu xác nhận không khớp!">
										<nz-input-group [nzSuffix]="confirmPasswordSuffixTemplate">
											<input [type]="showConfirmPassword ? 'text' : 'password'" nz-input
												formControlName="ConfirmPassword"
												placeholder="Nhập lại mật khẩu mới"
												autocomplete="new-password" />
										</nz-input-group>
										<ng-template #confirmPasswordSuffixTemplate>
											<nz-icon nzType="eye" nzTheme="outline" style="cursor: pointer;"
												(click)="toggleConfirmPassword()"></nz-icon>
										</ng-template>
									</nz-form-control>
								</nz-form-item>

								<div class="d-flex gap-2 mt-4">
									<button nz-button nzType="primary" nzBlock class="flex-grow-1">
										Xác nhận
									</button>
									<button nz-button nzType="default" type="button" (click)="goBack()" class="flex-grow-1">
										Quay lại
									</button>
								</div>
							</nz-spin>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>
