<nz-layout class="app-layout admin-layout">
    <nz-sider class="menu-sidebar" nzCollapsible nzWidth="256px" [nzCollapsedWidth]="64" [(nzCollapsed)]="isCollapsed" [nzTrigger]="null">
        <div class="sidebar-logo">
            <a (click)="goToHome()" style="cursor: pointer;">
                <img [src]="logoURL()" alt="logo" />
                <h1>{{ brandName() }}</h1>
            </a>
        </div>

        <div class="sidebar-scroll">
            <div class="sidebar-section">
                <span class="sidebar-section-label">Tổng quan</span>
                <ul nz-menu nzTheme="light" nzMode="inline">
                    <li nz-menu-item nzMatchRouter>
                        <a routerLink="/admin/dashboard" style="text-decoration: none;">
                            <nz-icon nzType="dashboard"></nz-icon>
                            <span>Dashboard</span>
                        </a>
                    </li>
                </ul>
            </div>

            <div class="sidebar-section">
                <span class="sidebar-section-label">Quản lý</span>
                <ul nz-menu nzTheme="light" nzMode="inline">
                    <li nz-menu-item nzMatchRouter>
                        <a routerLink="/admin/product" style="text-decoration: none;">
                            <nz-icon nzType="shopping"></nz-icon>
                            <span>Sản phẩm</span>
                        </a>
                    </li>
                    <li nz-menu-item nzMatchRouter>
                        <a routerLink="/admin/category" style="text-decoration: none;">
                            <nz-icon nzType="appstore"></nz-icon>
                            <span>Danh mục</span>
                        </a>
                    </li>
                    <li nz-menu-item nzMatchRouter>
                        <a routerLink="/admin/unit-count" style="text-decoration: none;">
                            <nz-icon nzType="calculator"></nz-icon>
                            <span>Đơn vị tính</span>
                        </a>
                    </li>
                    <li nz-menu-item nzMatchRouter>
                        <a routerLink="/admin/promotion" style="text-decoration: none;">
                            <nz-icon nzType="gift"></nz-icon>
                            <span>Khuyến mãi</span>
                        </a>
                    </li>
                    <li nz-menu-item nzMatchRouter>
                        <a routerLink="/admin/banner" style="text-decoration: none;">
                            <nz-icon nzType="picture"></nz-icon>
                            <span>Banner</span>
                        </a>
                    </li>
                    <li nz-menu-item nzMatchRouter>
                        <a routerLink="/admin/invoice" style="text-decoration: none;">
                            <nz-icon nzType="file-text"></nz-icon>
                            <span>Đơn hàng</span>
                        </a>
                    </li>
                    <li nz-menu-item nzMatchRouter>
                        <a routerLink="/admin/site-setting" style="text-decoration: none;">
                            <nz-icon nzType="setting"></nz-icon>
                            <span>Cấu hình site</span>
                        </a>
                    </li>
                </ul>
            </div>

            <div class="sidebar-section">
                <span class="sidebar-section-label">Hệ thống</span>
                <ul nz-menu nzTheme="light" nzMode="inline">
                    <li nz-menu-item nzMatchRouter>
                        <a routerLink="/home" style="text-decoration: none;">
                            <nz-icon nzType="export"></nz-icon>
                            <span>Xem trang web</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>

    </nz-sider>
    <nz-layout>
        <nz-header>
            <div class="app-header d-flex justify-content-between align-items-center">
                <div>
                    <span class="header-trigger" (click)="isCollapsed = !isCollapsed">
                        <nz-icon class="trigger" [nzType]="isCollapsed ? 'menu-unfold' : 'menu-fold'" />
                    </span>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <div class="user-chip">
                        <nz-avatar [nzText]="currentUser?.FullName?.charAt(0) || currentUser?.UserName?.charAt(0) || 'U'" nzSize="default" class="user-avatar"></nz-avatar>
                        <div class="user-info">
                            <strong class="user-name">{{ currentUser?.FullName || currentUser?.UserName }}</strong>
                            <small class="user-role">{{ currentUser?.RoleCodes }}</small>
                        </div>
                    </div>
                    <button nz-button nzType="text" nzDanger class="logout-btn" (click)="logout()">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span class="logout-label">Đăng xuất</span>
                    </button>
                </div>
            </div>
        </nz-header>
        <nz-content>
            <div class="inner-content">
                <router-outlet></router-outlet>
            </div>
        </nz-content>
    </nz-layout>
</nz-layout>
