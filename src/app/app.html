<nz-layout class="app-layout">
    <nz-sider class="menu-sidebar" nzCollapsible nzWidth="256px" nzBreakpoint="md" [(nzCollapsed)]="isCollapsed" [nzTrigger]="null">
        <div class="sidebar-logo">
            <a routerLink="/admin" target="_blank">
                <img [src]="logoURL" alt="logo" />
                <h1>SamFoods</h1>
            </a>
        </div>
        <ul nz-menu nzTheme="dark" nzMode="inline" [nzInlineCollapsed]="isCollapsed">
            <li nz-submenu nzOpen nzTitle="Dashboard" nzIcon="dashboard">
                <ul>
                    <li nz-menu-item nzMatchRouter>
                        <a routerLink="/admin/dashboard">Dashboard</a>
                    </li>
                    <li nz-menu-item nzMatchRouter>
                        <a routerLink="/admin/category">Danh mục</a>
                    </li>
                    <li nz-menu-item nzMatchRouter>
                        <a routerLink="/admin/unit-count">Đơn vị tính</a>
                    </li>
                    <li nz-menu-item nzMatchRouter>
                        <a routerLink="/admin/product">Sản phẩm</a>
                    </li>
                    <li nz-menu-item nzMatchRouter>
                        <a routerLink="/admin/promotion">Khuyến mại</a>
                    </li>
                </ul>
            </li>
            <li nz-submenu nzOpen nzTitle="Form" nzIcon="form">
                <ul>
                    <li nz-menu-item nzMatchRouter>
                        <a>Basic Form</a>
                    </li>
                </ul>
            </li>
        </ul>
    </nz-sider>
    <nz-layout>
        <nz-header>
            <div class="app-header">
                <span class="header-trigger" (click)="isCollapsed = !isCollapsed">
                    <nz-icon class="trigger" [nzType]="isCollapsed ? 'menu-unfold' : 'menu-fold'" />
                </span>
            </div>
        </nz-header>
        <nz-content class="m-3">
            <div class="inner-content p-2">
                <router-outlet></router-outlet>
            </div>
        </nz-content>
    </nz-layout>
</nz-layout>
