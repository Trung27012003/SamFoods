<app-admin-page-header
	title="Quản lý Khuyến mãi"
	subtitle="Danh sách chương trình khuyến mãi đang và sắp áp dụng"
	[breadcrumbs]="['Quản lý', 'Khuyến mãi']">
	<div actions class="d-flex gap-2">
		<button nz-button nzType="primary" (click)="onCreate()">
			<i class="fa-solid fa-plus me-1"></i>
			Thêm khuyến mãi
		</button>
		<button nz-button nzType="default" (click)="onEdit()" [disabled]="!selectedItem?.ID">
			<i class="fa-solid fa-pen me-1"></i>
			Sửa
		</button>
		<button nz-button nzType="default" nzDanger (click)="onDelete()" [disabled]="!selectedItem?.ID">
			<i class="fa-solid fa-trash me-1"></i>
			Xóa
		</button>
	</div>
</app-admin-page-header>

<app-admin-list-toolbar
	placeholder="Tìm theo mã, tên hoặc nội dung..."
	[searchValue]="searchValue()"
	(searchChange)="onSearch($event)">
</app-admin-list-toolbar>

<div class="admin-card p-0">
	<p-table
		size="small"
		[columns]="cols"
		[value]="promotions"
		[tableStyle]="{ 'min-width': '70rem' }"
		[loading]="isLoadingData()"
		selectionMode="single"
		[(selection)]="selectedItem"
		[scrollable]="true"
		scrollHeight="calc(100vh - 360px)"
		showGridlines
		[paginator]="true"
		[rows]="20"
		[rowsPerPageOptions]="[10, 20, 50]"
		[paginatorDropdownAppendTo]="'body'">
		<ng-template #header let-columns>
			<tr>
				@for (col of columns; track col) {
				<th>
					{{ col.header }}
				</th>
				}
			</tr>
		</ng-template>
		<ng-template #body let-rowData let-columns="columns">
			<tr [pSelectableRow]="rowData" (dblclick)="onEdit(rowData)">
				@for (col of columns; track col) {
				<td>
					@if (col.field === 'StatusText') {
					<app-admin-status-tag
						[color]="getStatusColor(rowData)"
						[label]="rowData[col.field]" />
					} @else if (col.field === 'DiscountDisplay') {
					<span class="fw-bold" style="color: var(--brand-primary);">{{ rowData[col.field] }}</span>
					} @else {
					{{ rowData[col.field] }}
					}
				</td>
				}
			</tr>
		</ng-template>
		<ng-template #emptymessage>
			<tr>
				<td [attr.colspan]="cols.length" class="text-center p-4">
					<nz-empty nzNotFoundContent="Không có khuyến mại nào"></nz-empty>
				</td>
			</tr>
		</ng-template>
	</p-table>
</div>
